<style>
/* Layout: sticky header with tabs, single centered column; summary tiles first, detail tables below. */
:root{
  --font:'Hind Siliguri','Noto Sans Bengali','Kalpurush','Nikosh',system-ui,sans-serif;
  --bg:#F2F5F1; --surface:#FFFFFF; --surface2:#E9EFEA; --ink:#14231E; --muted:#58675F; --line:#D6DFD8;
  --accent:#0E6B58; --accent-ink:#FFFFFF; --accent-soft:#DAEEE6;
  --in:#1A7A4F; --in-soft:#DCF0E4; --out:#B3402C; --out-soft:#F8E2DC; --warn:#8F5E06; --warn-soft:#F6EACB;
  --overlay:rgba(10,20,16,.5);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1613; --surface:#16211D; --surface2:#1E2C27; --ink:#E6EFEB; --muted:#9DB0A8; --line:#2B3C36;
  --accent:#4FC3A6; --accent-ink:#08201A; --accent-soft:#1B3A31;
  --in:#52C98F; --in-soft:#173A2A; --out:#F08A74; --out-soft:#40201A; --warn:#E4B04F; --warn-soft:#3A2E12;
  --overlay:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1613; --surface:#16211D; --surface2:#1E2C27; --ink:#E6EFEB; --muted:#9DB0A8; --line:#2B3C36;
  --accent:#4FC3A6; --accent-ink:#08201A; --accent-soft:#1B3A31;
  --in:#52C98F; --in-soft:#173A2A; --out:#F08A74; --out-soft:#40201A; --warn:#E4B04F; --warn-soft:#3A2E12;
  --overlay:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1040px;margin:0 auto}
.muted{color:var(--muted)}
.nowrap{white-space:nowrap}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-top:14px;border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{min-width:0;display:flex;align-items:center;gap:10px}.brand-logo{width:46px;height:46px;border-radius:12px;flex:none;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.brand-name{font-size:1.35rem;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.brand-sub{font-size:.85rem;color:var(--muted)}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-top:8px}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.6;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface2);filter:none}
.btn.danger{background:var(--out);border-color:var(--out);color:#fff}
.btn.sm{padding:5px 12px;font-size:.9rem}
.btn.link{background:none;border:0;color:var(--accent);padding:2px 4px;font-weight:600}
.btn.link.red{color:var(--out)}
.btn.link.armed{background:var(--out);color:#fff;border-radius:6px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.card h2{margin:0 0 12px;font-size:1.05rem;font-weight:700}
.stack{display:flex;flex-direction:column;gap:16px;padding-top:18px}
.grid2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px}
@media (max-width:760px){.grid2{grid-template-columns:minmax(0,1fr)}}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-head h1{margin:0;font-size:1.2rem;font-weight:700}

/* summary tiles */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 18px;min-width:0}
.tile .lbl{font-size:.9rem;color:var(--muted)}
.tile .val{font-size:1.7rem;font-weight:700;line-height:1.3;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile .sub{font-size:.82rem;color:var(--muted)}
.tile.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tile.main .lbl,.tile.main .sub{color:var(--accent-ink);opacity:.85}
.tile.in .val{color:var(--in)}
.tile.out .val{color:var(--out)}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.mini div{background:var(--surface2);border-radius:8px;padding:8px 12px}
.mini .lbl{font-size:.82rem;color:var(--muted)}
.mini .val{font-weight:700;font-variant-numeric:tabular-nums}

/* tables */
.scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;min-width:560px}
.tbl th{font-size:.82rem;font-weight:600;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:0}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl th.num{text-align:right}
.in-c{color:var(--in);font-weight:600}
.out-c{color:var(--out);font-weight:600}
.act{white-space:nowrap;text-align:right}
.sub{font-size:.85rem;color:var(--muted);overflow-wrap:anywhere}
.namebtn{background:none;border:0;padding:0;font-weight:600;color:var(--ink);cursor:pointer;text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.namebtn:hover{text-decoration-color:var(--accent);color:var(--accent)}

.pill{display:inline-block;padding:1px 10px;border-radius:999px;font-size:.82rem;font-weight:600;white-space:nowrap}
.pill.in{background:var(--in-soft);color:var(--in)}
.pill.out{background:var(--out-soft);color:var(--out)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.mute{background:var(--surface2);color:var(--muted)}

/* filters */
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:16px}
textarea{resize:vertical;min-height:64px}
label{display:block;font-size:.88rem;font-weight:600;margin-bottom:4px}
.field{margin-bottom:12px;min-width:0}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:480px){.fgrid{grid-template-columns:1fr}}
.req{color:var(--out)}

/* chart */
.legend{display:flex;gap:16px;font-size:.88rem;color:var(--muted);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:12px;font-family:var(--font)}
.chart .grid{stroke:var(--line);stroke-width:1}
.bar-in{fill:var(--in)}
.bar-out{fill:var(--out)}

/* progress */
.bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--in)}

/* notices */
.notice{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 14px;font-size:.92rem}
.empty{text-align:center;padding:28px 12px}
.empty h2{margin:0 0 6px}
.empty .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.ro{font-size:.82rem}

/* modal */
.overlay{position:fixed;inset:0;z-index:60;background:var(--overlay);display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.panel{background:var(--surface);border-radius:12px;width:100%;max-width:560px;max-height:100%;overflow-y:auto;padding:20px}
.panel h2{margin:0 0 14px;font-size:1.15rem}
.panel .btns{display:flex;gap:10px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:80;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;max-width:calc(100% - 32px);font-weight:500}
.toast.err{background:var(--out);color:#fff}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .18s ease-out}@keyframes pop{from{opacity:0;transform:translate(-50%,6px)}}}
</style>

var MONTHS=['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
var SHORT=['জানু','ফেব্রু','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টে','অক্টো','নভে','ডিসে'];
var monthLabel=function(ym){var p=ym.split('-');return MONTHS[+p[1]-1]+' '+bn(+p[0])};
var dateLabel=function(d){if(!d)return '';var p=d.split('-');return bn(+p[2])+'/'+bn(+p[1])+'/'+bn(+p[0])};
var addMonths=function(ym,k){var p=ym.split('-'),t=(+p[0])*12+(+p[1]-1)+k;return Math.floor(t/12)+'-'+pad(t%12+1)};

var TYPES={
  saving:{label:'সঞ্চয়/কিস্তি জমা',dir:1,member:true},
  loan_in:{label:'ঋণ আদায়',dir:1,member:true},
  income:{label:'অন্যান্য আয়/মুনাফা',dir:1,member:false},
  founder:{label:'প্রতিষ্ঠাতা মূলধন জমা',dir:1,member:true},
  interest:{label:'ঋণের সুদ/লাভ আদায়',dir:1,member:false},
  fine:{label:'জরিমানা আদায়',dir:1,member:false},
  loan_out:{label:'ঋণ প্রদান',dir:-1,member:true},
  withdraw:{label:'সঞ্চয় ফেরত',dir:-1,member:true},
  expense:{label:'খরচ',dir:-1,member:false}
};

var db=null,user=null,downloads=null,dbOk=true;
var S={members:[],txns:[],loans:[],calcAmt:10000,settings:{name:'একতাই আমাদের শক্তি',opening:0},loaded:{m:false,t:false,s:false},
  canWrite:false,tab:'dash',dueMonth:thisMonth(),f:{month:'',type:'',member:'',q:''},slow:false,err:''};
var C=null,MM={};

/* ---------- calculations ---------- */
function compute(){
  var opening=+S.settings.opening||0,tin=0,tout=0,ftot=0,byMonth={},ms={};
  MM={};S.members.forEach(function(m){var mo=+m.opening||0;opening+=mo;MM[m.id]=m;ms[m.id]={saved:mo,withdrawn:0,taken:0,repaid:0}});
  S.txns.forEach(function(t){
    var T=TYPES[t.type];if(!T)return;var a=+t.amount||0,ym=(t.date||'').slice(0,7);
    if(t.type==='founder'){ftot+=a;if(ym){var bf=byMonth[ym]||(byMonth[ym]={in:0,out:0});bf.f=(bf.f||0)+a}return}
    if(T.dir>0)tin+=a;else tout+=a;
    if(ym){var b=byMonth[ym]||(byMonth[ym]={in:0,out:0});if(T.dir>0)b.in+=a;else b.out+=a}
    var s=ms[t.memberId];
    if(s){if(t.type==='saving')s.saved+=a;else if(t.type==='withdraw')s.withdrawn+=a;else if(t.type==='loan_out')s.taken+=a;else if(t.type==='loan_in')s.repaid+=a}
  });
  var months=Object.keys(byMonth).sort(),run=opening,rows=months.map(function(ym){
    var b=byMonth[ym],f=b.f||0;run+=b.in-b.out+f;return {ym:ym,in:b.in,out:b.out,f:f,net:b.in-b.out,close:run}});
  var loanOut=0,savings=0;
  Object.keys(ms).forEach(function(k){if(MM[k]&&MM[k].founder)return;loanOut+=ms[k].taken-ms[k].repaid;savings+=ms[k].saved-ms[k].withdrawn});
  return {opening:opening,tin:tin,tout:tout,ftot:ftot,balance:opening+tin-tout+ftot,byMonth:byMonth,rows:rows,ms:ms,loanOut:loanOut,savings:savings};
}
function overdue(m){
  if(!m.joined||!(+m.monthly>0))return null;
  var start=m.joined.slice(0,7),cur=thisMonth();if(start>cur)return {months:0,expected:0,paid:0,due:0};
  var cnt=0,ym=start;while(ym<=cur&&cnt<600){cnt++;ym=addMonths(ym,1)}
  var paid=+m.opening||0;S.txns.forEach(function(t){if(t.type==='saving'&&t.memberId===m.id)paid+=+t.amount||0});
  var exp=cnt*(+m.monthly);return {months:cnt,expected:exp,paid:paid,due:Math.max(0,exp-paid)};
}
function odCell(m){var o=overdue(m);return o===null?'<span class="muted">—</span>':(o.due>0?'<span class="out-c">'+money(o.due)+'</span>':'<span class="in-c">বাকি নেই</span>')}
function dueFor(ym){
  var paid={};
  S.txns.forEach(function(t){if(t.type==='saving'){var p=t.period||(t.date||'').slice(0,7);if(p===ym)paid[t.memberId]=(paid[t.memberId]||0)+(+t.amount||0)}});
  var list=S.members.filter(function(m){return m.active!==false&&(+m.monthly||0)>0}).sort(byName).map(function(m){
    var p=paid[m.id]||0,e=+m.monthly,st=p>=e?'paid':(p>0?'part':'due');
    return {m:m,paid:p,expected:e,status:st};
  });
  var exp=0,col=0,full=0;list.forEach(function(r){exp+=r.expected;col+=Math.min(r.paid,r.expected);if(r.status==='paid')full++});
  return {list:list,expected:exp,collected:col,full:full};
}
function regs(){return S.members.filter(function(m){return !m.founder})}
function byName(a,b){return String(a.name).localeCompare(String(b.name),'bn')}
function sortedTxns(){return S.txns.slice().sort(function(a,b){return (b.date||'').localeCompare(a.date||'')||((b.createdAt||0)-(a.createdAt||0))})}

/* ---------- views ---------- */
function txRow(t,withAct){
  var T=TYPES[t.type]||{label:t.type,dir:1};
  var who=t.memberId&&MM[t.memberId]?MM[t.memberId].name:'';
  var per=t.type==='saving'&&t.period&&t.period!==(t.date||'').slice(0,7)?monthLabel(t.period)+' এর জন্য':'';
  var sub=[who,per,t.note].filter(Boolean).join(' · ');
  return '<tr><td class="nowrap">'+dateLabel(t.date)+'</td><td><span class="pill '+(T.dir>0?'in':'out')+'">'+esc(T.label)+'</span>'+(sub?'<div class="sub">'+esc(sub)+'</div>':'')+'</td>'+
    '<td class="num in-c">'+(T.dir>0?money(t.amount):'')+'</td><td class="num out-c">'+(T.dir<0?money(t.amount):'')+'</td>'+
    (withAct?'<td class="act">'+(S.canWrite?'<button class="btn link" data-act="edit-txn" data-id="'+esc(t.id)+'">✏️ এডিট</button><button class="btn link red" data-act="del-txn" data-id="'+esc(t.id)+'">🗑️ মুছুন</button>':'')+'</td>':'')+'</tr>';
}
function niceStep(x){var p=Math.pow(10,Math.floor(Math.log10(x))),f=x/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p}
function compact(v){return v>=1e7?nf.format(v/1e7)+' কোটি':v>=1e5?nf.format(v/1e5)+' লাখ':v>=1e3?nf.format(v/1e3)+' হাজার':bn(v)}
function chartHTML(){
  var cur=thisMonth(),rows=[];
  for(var i=5;i>=0;i--){var ym=addMonths(cur,-i),b=C.byMonth[ym]||{in:0,out:0};rows.push({ym:ym,in:b.in,out:b.out})}
  var peak=Math.max.apply(null,rows.map(function(r){return Math.max(r.in,r.out)}));
  if(peak<=0)return '<p class="muted">গত ৬ মাসে কোনো লেনদেন নেই।</p>';
  var W=440,H=240,L=72,R=10,T=14,B=32,iw=W-L-R,ih=H-T-B,gw=iw/rows.length,bw=Math.min(24,gw*.32);
  var step=niceStep(peak/4),max=step*4,g='';
  for(var k=0;k<=4;k++){var v=step*k,y=T+ih-ih*v/max;g+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end">'+compact(v)+'</text>'}
  rows.forEach(function(r,i){
    var cx=L+gw*i+gw/2,hi=ih*r.in/max,ho=ih*r.out/max,m=+r.ym.split('-')[1]-1;
    g+='<rect class="bar-in" x="'+(cx-bw-1)+'" y="'+(T+ih-hi)+'" width="'+bw+'" height="'+hi+'" rx="2"><title>'+monthLabel(r.ym)+' জমা '+money(r.in)+'</title></rect>';
    g+='<rect class="bar-out" x="'+(cx+1)+'" y="'+(T+ih-ho)+'" width="'+bw+'" height="'+ho+'" rx="2"><title>'+monthLabel(r.ym)+' বাহির '+money(r.out)+'</title></rect>';
    g+='<text x="'+cx+'" y="'+(H-10)+'" text-anchor="middle">'+SHORT[m]+'</text>';
  });
  return '<div class="legend"><span><i style="background:var(--in)"></i>জমা</span><span><i style="background:var(--out)"></i>বাহির</span></div>'+
    '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="গত ৬ মাসের মাসওয়ারি জমা ও বাহির">'+g+'</svg>';
}

  return '<div class="card empty"><h2>হিসাব শুরু করুন</h2><p class="muted">প্রথমে সদস্যদের নাম ও মাসিক কিস্তির পরিমাণ যোগ করুন, তারপর প্রতিটি জমা ও খরচ লিখুন। মোট জমা, বাহির ও ব্যালেন্স নিজে থেকেই হিসাব হবে।</p>'+
    (S.canWrite?'<div class="row"><button class="btn" data-act="new-member">সদস্য যোগ করুন</button><button class="btn ghost" data-act="sample-add">নমুনা তথ্য দিয়ে দেখুন</button></div>':'<p class="muted">এখনও কোনো তথ্য যোগ করা হয়নি।</p>')+'</div>';
}

  if(pc)b='<div class="stack" style="padding-bottom:0"><div class="card" data-tab="pend" style="cursor:pointer;border-color:var(--warn);background:var(--warn-soft)"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px"><div><b>⏳ '+bn(pc)+'টি '+(S.owner?'কাজ আপনার অনুমোদনের অপেক্ষায়':'আবেদন মালিকের অনুমোদনের অপেক্ষায়')+'</b><div class="sub">'+(S.owner?'দেখতে ও অনুমোদন দিতে এখানে চাপুন':'অবস্থা দেখতে এখানে চাপুন')+'</div></div><span style="font-size:1.4rem">›</span></div></div></div>';
  return b+viewDash0();
}
function viewDash0(){
  var cur=thisMonth(),b=C.byMonth[cur]||{in:0,out:0},d=dueFor(cur);
  var h='<div class="stack">';
  if(!S.members.length&&!S.txns.length)h+=onboarding();

    '<div class="tile main"><div class="lbl">💰 সর্বমোট তহবিল (এখন মোট কত টাকা আছে)</div><div class="val">'+money(C.balance)+'</div><div class="sub">সমিতি '+money(C.balance-C.ftot)+' + প্রতিষ্ঠাতা পার্সোনাল ফান্ড '+money(C.ftot)+'</div></div>'+
    '<div class="tile in"><div class="lbl">মোট জমা</div><div class="val">'+money(C.tin)+'</div><div class="sub">এই মাসে '+money(b.in)+'</div></div>'+
    '<div class="tile out"><div class="lbl">মোট বাহির</div><div class="val">'+money(C.tout)+'</div><div class="sub">এই মাসে '+money(b.out)+'</div></div></div>';
  h+='<div class="mini"><div><div class="lbl">🏛️ প্রতিষ্ঠাতা পার্সোনাল ফান্ড</div><div class="val">'+money(C.ftot)+'</div></div><div><div class="lbl">সদস্যদের মোট সঞ্চয়</div><div class="val">'+money(C.savings)+'</div></div>'+
    '<div><div class="lbl">ঋণ বাকি (বাজারে)</div><div class="val">'+money(C.loanOut)+'</div></div>'+
    '<div><div class="lbl">সক্রিয় সদস্য</div><div class="val">'+bn(regs().filter(function(m){return m.active!==false}).length)+' জন</div></div></div>';
  var pct=d.expected?Math.round(d.collected/d.expected*100):0;
  h+='<div class="grid2"><div class="card"><h2>গত ৬ মাসের জমা ও বাহির</h2>'+chartHTML()+'</div>'+
    '<div class="card"><h2>'+monthLabel(cur)+' এর কিস্তি</h2>'+
    (d.list.length?'<p style="margin:0 0 8px"><b>'+bn(d.list.length)+'</b> জনের মধ্যে <b>'+bn(d.full)+'</b> জন পুরো কিস্তি দিয়েছেন</p><div class="bar" role="progressbar" aria-valuenow="'+pct+'" aria-valuemin="0" aria-valuemax="100"><span style="width:'+pct+'%"></span></div>'+
      '<p class="sub" style="margin:8px 0 12px">আদায় '+money(d.collected)+' / প্রাপ্য '+money(d.expected)+' ('+bn(pct)+'%)</p><button class="btn ghost sm" data-tab="due">কে বাকি আছে দেখুন</button>':
      '<p class="muted">মাসিক কিস্তি ধরা আছে এমন সদস্য নেই। সদস্য যোগ করার সময় মাসিক কিস্তির পরিমাণ লিখুন।</p>')+'</div></div>';
  h+='<div class="card"><h2>নিজের হিসাব দেখুন</h2><label for="pick-member" class="muted" style="font-weight:500">আপনার নাম বাছুন, জমা, কিস্তি বকেয়া ও ঋণ বাকি দেখা যাবে</label><select id="pick-member"><option value="">— সদস্য বাছুন —</option>'+regs().sort(byName).map(function(m){return '<option value="'+esc(m.id)+'">'+esc(m.name)+'</option>'}).join('')+'</select></div>';
  var rec=sortedTxns().filter(function(t){return t.type!=='founder'}).slice(0,8);
  h+='<div class="card"><div class="page-head"><h2 style="margin:0">সাম্প্রতিক লেনদেন</h2><button class="btn ghost sm" data-tab="tx">সব দেখুন</button></div>'+
    (rec.length?'<div class="scroll"><table class="tbl"><thead><tr><th>তারিখ</th><th>বিবরণ</th><th class="num">জমা</th><th class="num">বাহির</th><th></th></tr></thead><tbody>'+rec.map(function(t){return txRow(t,true)}).join('')+'</tbody></table></div>':'<p class="muted" style="margin:0">কোনো লেনদেন নেই।</p>')+'</div>';
  return h+'</div>';
}
function filteredTxns(){
  var f=S.f,q=f.q.trim().toLowerCase();
  return sortedTxns().filter(function(t){
    if(t.type==='founder')return false;
    if(f.month&&(t.date||'').slice(0,7)!==f.month)return false;
    if(f.type&&t.type!==f.type)return false;
    if(f.member&&t.memberId!==f.member)return false;
    if(q){var hay=((MM[t.memberId]&&MM[t.memberId].name)||'')+' '+(t.note||'')+' '+((TYPES[t.type]||{}).label||'');if(hay.toLowerCase().indexOf(q)<0)return false}
    return true;
  });
}
function txList(){
  var list=filteredTxns(),i=0,o=0;
  list.forEach(function(t){var T=TYPES[t.type];if(!T)return;if(T.dir>0)i+=+t.amount||0;else o+=+t.amount||0});
  if(!list.length)return '<p class="muted" style="margin:0">'+(S.txns.length?'এই ফিল্টারে কোনো লেনদেন নেই।':'এখনও কোনো লেনদেন যোগ করা হয়নি।')+'</p>';
  return '<div class="scroll"><table class="tbl"><thead><tr><th>তারিখ</th><th>বিবরণ</th><th class="num">জমা</th><th class="num">বাহির</th><th></th></tr></thead><tbody>'+
    list.map(function(t){return txRow(t,true)}).join('')+'</tbody><tfoot><tr><td colspan="2">মোট ('+bn(list.length)+'টি)</td><td class="num in-c">'+money(i)+'</td><td class="num out-c">'+money(o)+'</td><td></td></tr></tfoot></table></div>';
}
function monthOptions(sel){

var PLANS=[3,6,12];
function rateOf(n){var r=S.settings['loanRate'+n];return r!=null&&isFinite(+r)&&+r>=0?+r:0}
function rateSet(){return PLANS.every(function(n){return S.settings['loanRate'+n]!=null})}
function pctTxt(r){return bn(r)+'%'}
function planOf(amount,n){var r=rateOf(n),I=Math.round(amount*r)/100,tot=amount+I;return {n:n,rate:r,interest:I,total:tot,monthly:tot/n}}
function schedule(l){
  var n=+l.months,P=+l.amount,I=+l.interest||0,p=Math.round(P/n),i=Math.round(I/n),out=[],ym=l.startMonth;
  for(var k=1;k<=n;k++){var pk=k===n?P-p*(n-1):p,ik=k===n?Math.round((I-i*(n-1))*100)/100:i;out.push({k:k,ym:ym,principal:pk,interest:ik,inst:Math.round((pk+ik)*100)/100});ym=addMonths(ym,1)}
  return out;
}
function loanInfo(l){
  var sc=schedule(l),paidK={};S.txns.forEach(function(t){if(t.type==='loan_in'&&t.loanId===l.id)paidK[t.instNo]=1});
  var paid=0,cnt=0,next=null;sc.forEach(function(r){if(paidK[r.k]){paid+=r.inst;cnt++}else if(!next)next=r});
  var total=+l.total||0;return {sc:sc,paidK:paidK,paid:paid,cnt:cnt,next:next,total:total,rest:Math.max(0,total-paid),pct:total?Math.min(100,paid/total*100):0};
}

function pfCheck(f){
  var need=[['nameEn','English নাম'],['father','পিতার নাম'],['mother','মাতার নাম'],['dob','জন্ম তারিখ'],['nid','NID / জন্মনিবন্ধন নম্বর'],['addr','বর্তমান ঠিকানা'],['nomName','নমিনির নাম'],['nomRel','নমিনির সম্পর্ক'],['nomPhone','নমিনির মোবাইল']];

/* ---------- report builder ---------- */
S.rp={scope:'month',month:thisMonth(),day:todayStr(),from:todayStr().slice(0,8)+'01',to:todayStr(),member:''};
function rpBuild(){
  var r=S.rp,sc=r.scope,d={org:S.settings.name||'একতাই আমাদের শক্তি',num:[],foot:null,key:sc,title:''};
  if(sc==='loans'||sc==='loansdone'){
    d.title=sc==='loansdone'?'শোধ হওয়া ঋণের রিপোর্ট':'সব ঋণের রিপোর্ট';
    d.heads=['সদস্য','ঋণের তারিখ','মেয়াদ (মাস)','সুদ %','ঋণ','সুদ','মোট ফেরত','ফেরত হয়েছে','বাকি','অবস্থা'];d.num=[4,5,6,7,8];d.rows=[];
    var T=[0,0,0,0,0];
    S.loans.slice().sort(function(a,b){return (a.createdAt||0)-(b.createdAt||0)}).forEach(function(l){
      var inf=loanInfo(l),done=inf.cnt>=(+l.months)&&inf.rest<=0;if(sc==='loansdone'&&!done)return;var m=MM[l.memberId];
      var v=[+l.amount||0,+l.interest||0,+l.total||0,inf.paid,inf.rest];v.forEach(function(x,i){T[i]+=x});
      d.rows.push([m?m.name:'',dateLabel(todayDate(l)),+l.months,+l.rate||0,v[0],v[1],v[2],v[3],v[4],done?'✅ শোধ সম্পূর্ণ':'চলমান'])});
    d.foot=['মোট','','','',T[0],T[1],T[2],T[3],T[4],''];
  }else{
    var lo=r.from||'',hi=r.to||'9999-12-31';if(lo&&hi&&lo>hi){var tmp=lo;lo=hi;hi=tmp}
    var list=sortedTxns().slice().reverse().filter(function(t){var dt=t.date||'';
      return sc==='month'?dt.slice(0,7)===r.month:sc==='day'?dt===r.day:sc==='range'?(dt>=lo&&dt<=hi):sc==='member'?t.memberId===r.member:true});
    d.heads=['তারিখ','ধরন','নাম','জমা','বাহির','প্রতিষ্ঠাতা ফান্ড','বিবরণ'];d.num=[3,4,5];
    var a=0,b=0,c=0;
    d.rows=list.map(function(t){var TT=TYPES[t.type]||{label:t.type,dir:1},x=+t.amount||0,f=t.type==='founder';
      if(f)c+=x;else if(TT.dir>0)a+=x;else b+=x;
      return [dateLabel(t.date),TT.label,(MM[t.memberId]||{}).name||'',(!f&&TT.dir>0)?x:'',TT.dir<0?x:'',f?x:'',t.note||'']});
    d.foot=['মোট','','',a,b,c,'নিট (জমা − বাহির): '+money(a-b)];
    var mn=(MM[r.member]||{}).name||'';
    d.title=sc==='month'?'মাসিক রিপোর্ট — '+monthLabel(r.month):sc==='day'?'দৈনিক রিপোর্ট — '+dateLabel(r.day):sc==='range'?'রিপোর্ট — '+dateLabel(lo)+' থেকে '+dateLabel(hi==='9999-12-31'?todayStr():hi):sc==='member'?'লেনদেন রিপোর্ট — '+mn:'সব লেনদেনের রিপোর্ট';
    d.key=sc==='month'?r.month:sc==='day'?r.day:sc;
  }
  return d;
}

  return order.map(function(k){var x=g[k];x.items.sort(function(a,b){return (a.at-b.at)||((a.seq||0)-(b.seq||0))});x.pending=x.items.some(function(i){return i.status==='pending'});x.status=x.pending?'pending':x.items[0].status;return x});
}
function gWhen(g){var t=0;g.items.forEach(function(i){t=Math.max(t,i.decidedAt||0)});return t||g.at}
function dkey(ts){var d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}

  if(S.owner&&g.pending)h+='<div class="btns" style="margin-top:10px"><button class="btn ghost" data-act="pend-no" data-id="'+esc(g.k)+'">❌ বাতিল</button><button class="btn" data-act="pend-ok" data-id="'+esc(g.k)+'">✅ অনুমোদন দিন</button></div>';

function pendFiltered(){
  var all=pGroups();if(!S.owner)all=all.filter(function(g){return g.uid===S.uid});
  var f=S.pf||'pending',list=all.filter(function(g){return g.status===f});
  if(f!=='pending'){
    if(S.f.pfrom){var pf0=new Date(S.f.pfrom).getTime();if(!isNaN(pf0))list=list.filter(function(g){return gWhen(g)>=pf0})}
    if(S.f.pto){var pt0=new Date(S.f.pto).getTime()+59999;if(!isNaN(pt0))list=list.filter(function(g){return gWhen(g)<=pt0})}
    if(S.owner&&S.f.pwho)list=list.filter(function(g){return g.uid===S.f.pwho});
    list.sort(function(a,b){return gWhen(b)-gWhen(a)});
  }
  return {all:all,list:list,f:f};
}

      (S.owner?'<div><label for="p-w">কার আবেদন</label><select id="p-w" data-f="pwho"><option value="">সবাই</option>'+Object.keys(ppl).map(function(u){return '<option value="'+esc(u)+'"'+(S.f.pwho===u?' selected':'')+'>'+esc(pName(u))+'</option>'}).join('')+'</select></div>':'')+
      '</div><p class="sub" style="margin:10px 0">'+bn(list.length)+'টি রেকর্ড'+((S.f.pfrom||S.f.pto||S.f.pwho)?' · <button class="btn link" data-act="pf-clear">ফিল্টার মুছুন</button>':'')+'</p>'+
      (downloads&&S.owner&&list.length?'<button class="btn ghost sm" data-act="pend-csv">🧾 এই তালিকা CSV ডাউনলোড</button>':'')+'</div>';

async function pendCsv(){
  var R=pendFiltered();if(!downloads||!S.owner||!R.list.length)return;
  var rows=[['আবেদনের সময়','কে জমা দিয়েছেন','কাজ','বিভাগ','বিবরণ','অবস্থা','সিদ্ধান্তের সময়','কে সিদ্ধান্ত নিয়েছেন']];
  R.list.forEach(function(g){g.items.forEach(function(i){rows.push([tmLabel(i.at),pName(g.uid),ACT[i.act]||i.act,COLL[i.coll]||i.coll,i.desc||'',i.status==='approved'?'অনুমোদিত':i.status==='rejected'?'বাতিল':'অপেক্ষায়',i.decidedAt?tmLabel(i.decidedAt):'',i.by?pName(i.by):''])})});
  var data='\ufeff'+rows.map(function(r){return r.map(csvCell).join(',')}).join('\r\n');
  try{await downloads.save({filename:'samiti-approval-record-'+todayStr()+'.csv',data:data});toast('ফাইল সংরক্ষিত হয়েছে')}catch(e){if(!e||e.code!=='declined')toast('ফাইল সংরক্ষণ করা যায়নি','err')}
}
async function applyPend(it){
  var d=it.json?JSON.parse(it.json):null,ref=rawDb.collection(it.coll).doc(it.docId);
  if(it.op==='delete')await ref.delete();else if(it.op==='update')await ref.update(d||{});else await ref.set(d||{});
}
async function decideGroup(k,ok){
  var g=pGroups().filter(function(x){return x.k===k})[0];if(!g)return;
  var items=g.items.filter(function(i){return i.status==='pending'}),n=0;
  for(var i=0;i<items.length;i++){
    var it=items[i];
    if(ok)await applyPend(it);
    await rawDb.collection('pending').doc(it.id).update({status:ok?'approved':'rejected',decidedAt:Date.now(),by:S.uid||''});
    logRaw(ok?'approve':'reject',COLL[it.coll]||it.coll,pName(it.uid)+' · '+(it.desc||''));n++;
  }
  return n;
}
async function pendDecide(k,ok,all){
  if(!S.owner||!rawDb||S.pbusy)return;S.pbusy=true;
  try{
    var keys=all?pGroups().filter(function(g){return g.pending}).slice().reverse().map(function(g){return g.k}):[k],n=0;
    for(var i=0;i<keys.length;i++)n+=await decideGroup(keys[i],ok);
    toast(ok?'✅ অনুমোদিত হয়েছে, হিসাবে যুক্ত হয়েছে':'বাতিল করা হয়েছে');
  }catch(e){toast(errMsg(e),'err')}
  S.pbusy=false;render();
}

var DEFAULT_RULES="স্লোগান: 💪 একতাই আমাদের শক্তি। একসঙ্গে আমরা সবথেকে শক্তিশালী! 🤝\n\n১. সাংগঠনিক শৃঙ্খলা ও সদস্যপদ।\nসিদ্ধান্ত পালন: সমিতির যেকোনো সিদ্ধান্ত অমান্য করলে সদস্যপদ বাতিল বলে গণ্য হবে।\nকর্তৃত্ব: সভাপতি বা পরিচালনা কমিটির অনুমতি ছাড়া কোনো সিদ্ধান্ত কার্যকর করা যাবে না।\nযোগাযোগ: অনুমতি ছাড়া বাইরের কোনো সংগঠনের সাথে সমিতির বিষয়ে যোগাযোগ করা নিষিদ্ধ।\nগোপনীয়তা: সমিতির গোপনীয় তথ্য বাইরে প্রকাশ করলে তাৎক্ষণিক বহিষ্কার করা হবে।\nআচরণবিধি: নির্ধারিত পোশাক বা আচরণবিধি মেনে চলা প্রত্যেক সদস্যের জন্য বাধ্যতামূলক।\nভাবমূর্তি: সমিতির সম্মান বা ভাবমূর্তি ক্ষুণ্ণ করে এমন কোনো কাজ করা কঠোরভাবে নিষিদ্ধ।\nপারস্পরিক শ্রদ্ধা: সভায় কথা বলার সময় উচ্চবাচ্য করা বা অন্য কোনো সদস্যকে ব্যক্তিগত আক্রমণ করা যাবে না।\nবিরোধ সৃষ্টি: সদস্যদের মধ্যে ইচ্ছাকৃতভাবে কোন্দল বা বিরোধ সৃষ্টি করলে সদস্যপদ বাতিল হবে।\nসদস্য নিয়োগ: নতুন সদস্য পদের জন্য পরিচালনা পর্ষদের সুপারিশ এবং সাধারণ সভায় অতীত রেকর্ড যাচাই বাধ্যতামূলক।\n\n২. সভা ও উপস্থিতি।\nঅংশগ্রহণ: নির্দিষ্ট সংখ্যক সভায় অংশগ্রহণ না করলে বিশেষ বিবেচনায় সদস্যপদ স্থগিত করা হবে।\nজরুরি সভা: বিশেষ প্রয়োজনে সভাপতি বা সম্পাদকের আহ্বানে ২৪ ঘণ্টার নোটিশে জরুরি সভা ডাকা যাবে।\nতথ্য হালনাগাদ: ঠিকানা বা মোবাইল নম্বর পরিবর্তন হলে এক সপ্তাহের মধ্যে সমিতিকে জানাতে হবে।\n\n৩. আর্থিক লেনদেন ও ব্যবস্থাপনা।\nব্যক্তিগত গ্যারান্টি: ঋণ গ্রহণকারী সদস্যকে অন্য ১ বা ২ জন সদস্যের 'গ্যারান্টি' বাধ্যতামূলক। ঋণগ্রহীতা টাকা দিতে ব্যর্থ হলে গ্যারান্টাররা তা পরিশোধে বাধ্য থাকেন।\nকিস্তি ও সঞ্চয়: নির্দিষ্ট সময়ের মধ্যে কিস্তি বা মাসিক জমা প্রদান করা বাধ্যতামূলক।\nঋণ নীতি: কিস্তি বা সঞ্চয় জমায় নিয়মিত না হলে কোনো সদস্য ঋণের জন্য আবেদন করতে পারবেন না।\nস্বচ্ছতা: আর্থিক হিসাব-নিকাশে কোনো অনিয়ম প্রমাণিত হলে সংশ্লিষ্ট সদস্যকে তাৎক্ষণিক বহিষ্কার করা হবে।\nব্যক্তিগত ব্যবহার: ব্যক্তিগত কাজে সমিতির টাকা ব্যবহার করা সম্পূর্ণ নিষিদ্ধ।\nপূর্ণ পরিশোধ: কোনো ব্যক্তি যদি মাত্র এক সেকেন্ড বা এক দিনের জন্যও অর্থ ঋণ গ্রহণ করেন, তবে চুক্তিবদ্ধ হার অনুযায়ী নির্ধারিত সম্পূর্ণ অর্থই তাকে পরিশোধ করতে হবে।\nদ্রুত পরিশোধের ক্ষেত্রে নিয়ম: ঋণ গ্রহণের পর যদি গ্রহীতা মনে করেন যে তার পরের দিনই (আগামীকাল) টাকা ফেরত দেওয়ার সক্ষমতা আছে, তবুও তাকে চুক্তির শর্তানুযায়ী নির্ধারিত পূর্ণ অর্থসহই তা পরিশোধ করতে হবে।\nলেনদেন: সমিতির যাবতীয় আর্থিক লেনদেন ব্যাংক/ মোবাইল ব্যাংক(খরচসহ)/হাতে ক্যাশ মাধ্যমে সম্পন্ন হতে হবে।\nসদস্যদের লেনদেন: সদস্যদের মধ্যে ঋণ নিলে ঋণের টাকা পরিশোধ না হওয়া পর্যন্ত সদস্যের মূল সঞ্চয় তোলা বা সমিতি ত্যাগ করা নিষিদ্ধ।\nবিলম্ব ফি: কিস্তি দিতে দেরি করলে একটি ছোট অঙ্কের জরিমানা বা বিলম্ব ফি ধার্য করা হবে কমিটির আলোচনা সাপেক্ষে যাতে সবাই সময়মতো টাকা দেয়।\nপ্রতিবেদন: মাসিক বা ত্রৈমাসিক আর্থিক প্রতিবেদন সাধারণ সভায় উপস্থাপন করতে হবে।\nঅডিট: স্বচ্ছতা বজায় রাখতে প্রতি বছর বার্ষিক অডিট (হিসাব নিরীক্ষা) করা বাধ্যতামূলক।\nলভ্যাংশ: বার্ষিক লভ্যাংশ বা ক্ষতি কেবল পূর্ণ সক্রিয় সদস্যদের মধ্যেই আনুপাতিক হারে বণ্টন করা হবে।\n\n৪. বহিষ্কার ও দায়িত্ব হস্তান্তর।\nসম্পদ হস্তান্তর: কোনো সদস্য পদত্যাগ করলে বা বহিষ্কৃত হলে ৩ কার্যদিবসের মধ্যে তার অধীনে থাকা যাবতীয় নথিপত্র ও সম্পদ সমিতিকে বুঝিয়ে দিতে হবে।\nসামাজিক দায়বদ্ধতা: রাজনৈতিক বা সাম্প্রদায়িক কর্মকাণ্ডে সমিতির নাম বা পদবী ব্যবহার করা যাবে না।\nসদস্যদের মধ্যে পদত্যাগ: কেউ যদি সমিতি থাকে পদত্যাগ নিতে চায় তাহলে মিনিমাম চার মাস অথবা সর্বোচ্চ ৮ মাস আগে জানাতে হবে। (কমিটি আলোচনা সাপেক্ষে)\n\n★★★\nমনে রাখবেন: সমিতির মূল ভিত্তি হলো 'একতা ও বিশ্বাস'। তবে টাকা-পয়সার ক্ষেত্রে বিশ্বাসের চেয়ে লিখিত নিয়ম ও চুক্তি বেশি কার্যকর।";
S.rules={text:null,at:0,by:''};
function rulesText(){return (S.rules.text==null||!String(S.rules.text).trim())?DEFAULT_RULES:S.rules.text}
function rulesHtml(t){
  var out='',lines=String(t).split(/\r?\n/);
  lines.forEach(function(raw){
    var l=raw.trim();if(!l)return;
    if(/^স্লোগান\s*[:：]/.test(l)){out+='<div class="rules-slogan">'+esc(l.replace(/^স্লোগান\s*[:：]\s*/,''))+'</div>';return}
    if(/^[★*✦\-–—\s]{3,}$/.test(l)){out+='<div style="text-align:center;color:var(--muted);margin-top:14px">'+esc(l)+'</div>';return}
    if(/^[১-৯০-৯1-9][০-৯0-9]*\s*[.।)]/.test(l)){out+='<h3 class="rules-h">'+esc(l.replace(/[.।]\s*$/,''))+'</h3>';return}
    if(/^মনে রাখবেন/.test(l)){out+='<div class="rules-note">'+esc(l)+'</div>';return}
    var i=l.indexOf(':');
    if(i>0&&i<=40){out+='<div class="rules-i"><b>'+esc(l.slice(0,i))+':</b>'+esc(l.slice(i+1))+'</div>';return}
    out+='<div class="rules-i">'+esc(l)+'</div>';
  });
  return out;
}
function viewRules(){
  var h='<div class="stack"><div class="page-head"><h1>📖 সমিতির নিয়মকানুন</h1>'+(S.owner?'<button class="btn sm" data-act="rules-edit">✏️ সম্পাদনা করুন</button>':'<span class="pill mute">👀 শুধু দেখা যাবে</span>')+'</div>';
  h+='<div class="card">'+rulesHtml(rulesText())+'</div>';
  if(S.rules.at)h+='<p class="sub" style="margin:0">সর্বশেষ বদল: '+esc(new Date(S.rules.at).toLocaleString('bn-BD',{dateStyle:'medium',timeStyle:'short'}))+'</p>';
  return h+'</div>';
}
function rulesForm(){
  return '<h2>✏️ নিয়মকানুন সম্পাদনা</h2><form data-form="rules" novalidate><p class="sub" style="margin:-6px 0 10px">প্রতিটি নিয়ম আলাদা লাইনে লিখুন। "নাম: বিবরণ" আকারে লিখলে নাম মোটা অক্ষরে দেখাবে। নম্বরসহ লাইন (যেমন "৫. নতুন অংশ।") শিরোনাম হবে।</p><textarea class="rules-ta" name="text">'+esc(rulesText())+'</textarea><div class="btns"><button type="button" class="btn ghost" data-act="rules-reset">আসল লেখা ফিরিয়ে আনুন</button><button type="button" class="btn ghost" data-act="close-modal">বাতিল</button><button type="submit" class="btn">সংরক্ষণ করুন</button></div></form>';
}
async function submitRules(form){
  if(!S.owner||!db){toast('নিয়ম বদলানোর অনুমতি শুধু মালিকের আছে','err');return}
  var btn=form.querySelector('[type=submit]');btn.disabled=true;
  try{await db.doc('settings/rules').set({text:form.elements.text.value,at:Date.now()});closeModal();toast('নিয়মকানুন সংরক্ষিত হয়েছে')}
  catch(e){btn.disabled=false;toast('সংরক্ষণ করা যায়নি','err')}
}

  else if(a==='lr-go'){var n1=new Date();n1.setHours(0,0,0,0);var fa=new Date(S.f.lfrom||toLocalStr(n1.getTime())).getTime(),ta=new Date(S.f.lto||toLocalStr(Date.now())).getTime();if(isNaN(fa)||isNaN(ta)){toast('সময় ঠিকভাবে বাছুন','err')}else runRange(fa,ta,'')}

  else if(a==='pp-pre'){var pq=presetRange(id);S.f.pfrom=toLocalStr(pq[0]);S.f.pto=toLocalStr(pq[1]);render()}

  if(t.id==='l-plan'){updLoanPrev();return}
  if(t.id==='pick-member'){if(t.value){ledger(t.value);t.value=''}return}
  if(t.id==='due-m'){if(t.value){S.dueMonth=t.value;render()}return}
  if(t.dataset&&t.dataset.f&&t.dataset.f!=='q'){S.f[t.dataset.f]=t.value;render()}
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='calc-amt'){var v=num(t.value);S.calcAmt=isNaN(v)?0:v;var co=$('#calc-out');if(co)co.innerHTML=calcHTML(S.calcAmt);return}
  if(t.id==='l-amount'){updLoanPrev();return}
  if(t.dataset&&t.dataset.f==='q'){S.f.q=t.value;var el=$('#txlist');if(el)el.innerHTML=txList()}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});


/* ---------- ব্যাক বাটন: অ্যাপ থেকে বেরিয়ে না গিয়ে আগের পাতা/ট্যাবে ফেরে ---------- */
var TABSET={dash:1,tx:1,due:1,loan:1,mem:1,fnd:1,rep:1,rules:1,pend:1,log:1};
S.mOpen=false;S.mPushed=false;S.backPend=false;
function hashParts(){var h=(location.hash||'').replace(/^#/,'');return {m:/-m$/.test(h),t:h.replace(/-m$/,'')}}
function tabOk(t){return !!TABSET[t]&&!(t==='log'&&!S.owner)&&!(t==='pend'&&!S.canWrite)}
window.addEventListener('hashchange',function(){
  var h=hashParts();
  if(S.backPend){S.backPend=false;if(S.mOpen){try{location.hash=S.tab+'-m';S.mPushed=true}catch(e){}}return}
  if(!h.m&&S.mOpen){S.mOpen=false;S.mPushed=false;$('#modal').hidden=true;$('#panel').innerHTML=''}
  else if(h.m&&!S.mOpen){try{location.replace('#'+h.t)}catch(e){}return}
  var t=h.t||'dash';
  if(tabOk(t)&&t!==S.tab){S.tab=t;render();window.scrollTo(0,0)}
});
/* ---------- start ---------- */
async function start(){
  render();
  var slowT=setTimeout(function(){S.slow=true;render()},10000);
  try{
    var c=window.claude;
    if(!c||!c.use)throw new Error('no runtime');
    db=await c.use('db');user=await c.use('user');downloads=await c.use('downloads');if(db){rawDb=db;db=wrapDb(rawDb)}
  }catch(e){db=null}
  if(!db){clearTimeout(slowT);dbOk=false;render();return}
  try{S.owner=user?!!(await user.isOwner()):false;S.canWrite=S.owner||(user?!!(await user.canEdit()):false)}catch(e){S.canWrite=false}
  try{S.uid=user?await user.id():null}catch(e){}
  try{var h0=hashParts();if(tabOk(h0.t))S.tab=h0.t;if(h0.m)location.replace('#'+(h0.t||'dash'))}catch(e){}
  if(S.owner)subLogs();
  if(S.canWrite)subPend();
  var done=function(k){return function(){S.loaded[k]=true;clearTimeout(slowT);render()}};
  var fail=function(){clearTimeout(slowT);dbOk=false;render()};
  db.collection('members').onSnapshot(function(snap){S.members=snap.docs.map(function(d){return Object.assign({},d.data()||{},{id:d.id})});done('m')()},fail);
  db.collection('txns').onSnapshot(function(snap){S.txns=snap.docs.map(function(d){return Object.assign({},d.data()||{},{id:d.id})});done('t')()},fail);
  db.collection('loans').onSnapshot(function(snap){S.loans=snap.docs.map(function(d){return Object.assign({},d.data()||{},{id:d.id})});done('l')()},fail);
  db.doc('settings/rules').onSnapshot(function(snap){var o=snap.exists?snap.data():{};S.rules={text:(o&&typeof o.text==='string')?o.text:null,at:+(o&&o.at)||0};if(S.tab==='rules'&&$('#modal').hidden)render()},function(){});
  db.doc('settings/main').onSnapshot(function(snap){var o=snap.exists?snap.data():{};S.settings=Object.assign({},o,{name:o.name||'একতাই আমাদের শক্তি',opening:+o.opening||0});done('s')()},fail);
}
start();
})();
</script>

<script>
(function(){
var L=[["auto", "🔄 অটো", "#F2F5F1", "#0E6B58", "#e9b949", "#16211D"], ["light", "☀️ দিন", "#F2F5F1", "#0E6B58", "#2fb592", "#FFFFFF"], ["dark", "🌙 রাত", "#0E1613", "#4FC3A6", "#2fb592", "#16211D"], ["royal", "👑 রাজকীয়", "#14100A", "#E6B93C", "#B8791A", "#1D1710"], ["ocean", "🌊 সমুদ্র", "#EAF6FB", "#0B7BB5", "#7ED6F2", "#FFFFFF"], ["sunset", "🌅 সূর্যাস্ত", "#FFF3EA", "#E2552B", "#FFC13B", "#FFFFFF"], ["rose", "🌸 গোলাপি", "#FFF0F5", "#D6336C", "#FFC078", "#FFFFFF"], ["neon", "⚡ নিওন", "#0A0716", "#00F0FF", "#FF3DCB", "#130E26"], ["bijoy", "🇧🇩 বিজয়", "#EAF6EC", "#006A4E", "#F42A41", "#FFFFFF"], ["galaxy", "🌌 মহাকাশ", "#070B1F", "#8AA2FF", "#4DD6FF", "#0F1633"], ["coffee", "☕ কফি", "#F6EFE7", "#7B4A2D", "#D9A25F", "#FFFBF6"], ["rainbow", "🌈 রংধনু", "#FFFDF7", "#7C3AED", "#FFC53D", "#FFFFFF"]];
function cur(){try{return localStorage.getItem('skin')||'auto'}catch(e){return'auto'}}
function apply(id){var r=document.documentElement;r.removeAttribute('data-skin');r.removeAttribute('data-theme');
 if(id==='light'||id==='dark')r.setAttribute('data-theme',id);else if(id!=='auto')r.setAttribute('data-skin',id);
 try{localStorage.setItem('skin',id)}catch(e){}
 var m=document.querySelector('meta[name=theme-color]');if(m)m.content=getComputedStyle(r).getPropertyValue('--bg').trim()||m.content}
function open(){var c=cur(),h='<div class="sk-ov" id="sk-ov"><div class="sk-pan"><h2>🎨 থিম বাছুন</h2><div class="muted" style="font-size:.9rem">ছুঁলেই সাথে সাথে বদলে যাবে — আপনার ফোনে মনে থাকবে</div><div class="sk-grid">';
 L.forEach(function(t){h+='<button type="button" class="sk-it" data-sk="'+t[0]+'" aria-pressed="'+(t[0]===c)+'"><div class="sk-sw"><i style="background:'+t[2]+'"></i><i style="background:'+t[3]+'"></i><i style="background:'+t[4]+'"></i><i style="background:'+t[5]+'"></i></div><div class="sk-n">'+t[1]+'</div></button>'});
 h+='</div><button type="button" class="btn" id="sk-x" style="width:100%">বন্ধ করুন</button></div></div>';
 var d=document.createElement('div');d.innerHTML=h;document.body.appendChild(d.firstChild)}
document.addEventListener('click',function(e){var t=e.target;if(!t.closest)return;
 if(t.closest('#skin-btn')){open();return}
 var it=t.closest('.sk-it');if(it){apply(it.dataset.sk);document.querySelectorAll('.sk-it').forEach(function(x){x.setAttribute('aria-pressed',x===it)});return}
 if(t.id==='sk-ov'||t.closest('#sk-x')){var o=document.getElementById('sk-ov');if(o)o.remove()}});
apply(cur());
})();
</script>
